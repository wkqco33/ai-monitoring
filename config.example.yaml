# ai-monitoring 설정 예시
#
# 이 파일을 ~/.config/ai-monitoring/config.yaml 로 복사한 뒤
# 실제 값으로 수정해서 사용하세요.

# 시스템 상태 점검 주기
check_interval: 10s

# CPU 사용률 경고 기준(%)
cpu_threshold: 90.0

# 메모리 사용률 경고 기준(%)
memory_threshold: 90.0

# Azure OpenAI 설정
azure_endpoint: https://your-resource-name.openai.azure.com/
azure_api_key: your-api-key-here
azure_deployment: gpt-4o

# 알림용 봇 토큰
bot_token: your-bot-token-here

# 같은 이상 상태에 대해 다시 알림을 보내기까지의 최소 간격
cooldown_period: 5m
